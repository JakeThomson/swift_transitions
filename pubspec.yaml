name: swift_transitions
description: >-
  iOS's navigation transitions for Flutter: the iOS 18 zoom transition with
  its interactive dismissal, and the push, both fitted frame by frame against
  the real thing.
version: 0.2.0
repository: https://github.com/JakeThomson/swift_transitions
issue_tracker: https://github.com/JakeThomson/swift_transitions/issues

topics:
  - transition
  - animation
  - navigation
  - cupertino
  - ios

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
