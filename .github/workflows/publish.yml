# Publishes the package to pub.dev when a version tag is pushed.
#
# Requires automated publishing from GitHub Actions to be enabled for this
# repository in the package's admin settings on pub.dev. The reusable workflow
# installs the Flutter SDK, runs a dry run and then publishes using an OIDC
# token, so no pub.dev credentials are stored in the repository.
name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
