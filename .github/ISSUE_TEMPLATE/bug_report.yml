name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >-
        A small, complete `main.dart` that shows the problem. Issues without a
        reproduction are much harder to act on.
      render: dart
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: swift_transitions version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Affected platforms
      multiple: true
      options:
        - iOS
        - Android
        - macOS
        - Web
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: flutter doctor -v
      render: text
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screen recording
      description: For animation bugs a short recording is often the fastest way to explain the problem.
